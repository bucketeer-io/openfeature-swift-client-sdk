name: Pull Request

on:
  pull_request:
    paths-ignore:
      - '*.md'
      - '.github/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  lint_swift:
    # analyzer_rules in .swiftlint.yml need SourceKit; Linux release binaries cannot load it on GHA.
    runs-on: macos-15-xlarge
    env:
      MINT_PATH: .mint/lib
      MINT_LINK_PATH: .mint/bin
      SWIFTLINT_VERSION: 0.53.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Mint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mint
          key: ${{ runner.os }}-mint-swiftlint-${{ env.SWIFTLINT_VERSION }}
          restore-keys: |
            ${{ runner.os }}-mint-swiftlint-

      - name: Install Mint and SwiftLint
        run: |
          brew list mint &>/dev/null || brew install mint
          mint install "realm/SwiftLint@${SWIFTLINT_VERSION}"

      - name: Lint swift
        run: mint run swiftlint --strict

  generate-xcode-project:
    uses: ./.github/workflows/generate-xcode-project.yml

  build:
    needs: generate-xcode-project
    runs-on: macos-15-xlarge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Download xcode project file
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: output-xcodeproj-file
          path: ./BucketeerOpenFeatureProvider.xcodeproj

      # The artifact contains a single file; download to the repo root so it
      # lands at ./environment.xcconfig instead of ./environment.xcconfig/environment.xcconfig
      - name: Download environment file
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: output-environment-file
          path: .


      - name: Build
        env:
          CI: true
        run: make build
        
      - name: Build example
        env:
          CI: true
        run: make build-example

  
  test:
    needs: generate-xcode-project
    runs-on: macos-15-xlarge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Download xcode project file
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: output-xcodeproj-file
          path: ./BucketeerOpenFeatureProvider.xcodeproj

      - name: Build for testing
        env:
          CI: true
        run: make build-for-testing

      - name: Unit Test
        run: make test-without-building